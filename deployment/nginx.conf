# ============================================================================
# Nginx as a TCP load balancer for FastChat's socket server.
#
# IMPORTANT: This lives in the `stream {}` block, NOT `http {}`. The socket
# server speaks a raw length-prefixed TLS/TCP protocol, not HTTP, so Nginx
# can't reverse-proxy it with `proxy_pass` the way it would a web app --
# `stream` does layer-4 (TCP) load balancing instead: it picks a backend and
# then blindly forwards bytes in both directions for the life of the
# connection. This requires the `ngx_stream_module` (often a separate build
# flag / package: `nginx-extras` on Debian, or compile with
# --with-stream).
#
# TLS TERMINATION CHOICE: two valid options --
#   (a) Terminate TLS at Nginx, forward plaintext to backends over a
#       trusted private network. Simpler cert management (one cert on
#       Nginx), but backends receive unencrypted traffic -- only safe if
#       the Nginx<->backend network segment is itself trusted/private.
#   (b) Passthrough mode (`ssl_preread`): Nginx routes based on the TLS
#       SNI/ClientHello without decrypting, and each backend terminates
#       its own TLS. Shown below, since tcp_server.py already does its own
#       TLS termination and we don't want to double up on cert management
#       unnecessarily -- pick (a) instead if we want centralized cert
#       rotation and a trusted internal network.
# ============================================================================

stream {
    upstream fastchat_backends {
        # least_conn: send new connections to whichever backend currently
        # has the fewest open connections. For a long-lived, persistent
        # chat protocol (as opposed to short HTTP requests), this is far
        # better than round-robin -- round-robin would happily keep
        # assigning new connections to a backend that's already saturated
        # with thousands of long-lived idle sockets from earlier rounds.
        least_conn;

        server 10.0.1.11:8443 max_fails=3 fail_timeout=30s;
        server 10.0.1.12:8443 max_fails=3 fail_timeout=30s;
        server 10.0.1.13:8443 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 443;
        proxy_pass fastchat_backends;

        # Passthrough: don't terminate TLS here, just route on SNI and
        # relay encrypted bytes untouched to the chosen backend.
        ssl_preread on;

        # Long-lived chat connections should not be killed by an
        # over-eager idle timeout -- clients send app-level "ping" frames,
        # but give Nginx generous headroom too.
        proxy_timeout 10m;
        proxy_connect_timeout 5s;
    }
}

