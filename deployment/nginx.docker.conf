# Dockerized version of the TCP load balancer described in nginx.conf's
# comments, wired to actual Docker Compose service names instead of
# placeholder IPs. Mounted straight in as /etc/nginx/nginx.conf (this file
# replaces nginx's default config entirely, not just its `stream` block --
# that's why `events {}` is present, which is otherwise a separate
# top-level directive Nginx requires regardless of what else we configure).
#
# This nginx does NOT terminate TLS -- see `ssl_preread` below. Each
# socket-server instance still terminates its own TLS individually, using
# the identical self-signed cert both instances share via a bind-mounted
# volume (see docker-compose.yml's `cert-init` service).

worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    upstream fastchat_backends {
        # least_conn: appropriate for long-lived persistent chat
        # connections -- see the extended rationale in nginx.conf.
        least_conn;

        # Docker Compose's built-in DNS resolves these service names to
        # whichever container IP is currently running that service --
        # no hardcoded IPs needed, unlike a bare-metal deployment.
        server socket-server-1:8443 max_fails=3 fail_timeout=10s;
        server socket-server-2:8443 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8443;
        proxy_pass fastchat_backends;

        # Route based on the TLS ClientHello/SNI without decrypting --
        # each backend instance terminates its own TLS individually.
        ssl_preread on;

        proxy_timeout 10m;
        proxy_connect_timeout 5s;
    }
}
